name: Build and Release

on:
  push:
    tags:
      - 'v*'

# R37 P1 (v0.18.23): 동일 태그를 재푸시(force-push)하거나 거의 동시에 별개 v* 태그가 들어오면
# 두 release 잡이 병렬로 실행되어 softprops/action-gh-release 의 `append_body: true` + SHA256SUMS
# 파일 업로드가 race 한다 (두 번째 잡이 첫 번째의 SHA-256 라인을 덮어쓰거나, 동일 해시 라인을
# 중복 append). cancel-in-progress: false — 태그는 이미 push 되어 있고 이미 실행 중인 빌드를
# 죽이면 release 자산이 비어 사용자가 다시 태깅해야 하므로 직렬화만 한다. tag 단위 group 으로
# 묶어 서로 다른 태그(예: v0.18.23 과 v0.19.0)는 그대로 병렬 허용.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# QA20(B-MED): 권한은 **잡 단위**로 최소화한다. 이전에는 워크플로 수준에 contents:write /
# id-token:write / attestations:write 를 두어 `test` 잡까지 상속했는데, 그 잡은 `npm ci` 로
# 수십 개 devDependency 의 라이프사이클 스크립트를 실행하고 actions/checkout 이 기본값
# (persist-credentials:true)으로 토큰을 .git/config 에 남긴다 — 침해된 devDependency 하나가
# 저장소 계정 탈취 없이 릴리즈 자산(latest.yml/installer)을 덮어쓸 수 있었다. 자동 업데이트
# 도입 이후 그 자산은 곧 "전 사용자 코드 실행"이므로 표면을 좁힌다. (test.yml 은 이미
# contents:read 로 최소화돼 있어 같은 저장소 안의 비대칭이었다.)
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # R28: Windows 회귀(경로 구분자, pwsh 인용, cpSync 동작)를 사전 차단하기 위해 OS matrix 도입.
    # macOS는 release 빌드에서 제외했으므로 test에서도 제외.
    strategy:
      # v0.18.19 patch R32 P3: fail-fast false — Ubuntu 플레이크가 Windows 빌드를 cancel 하지
      # 않도록. 태그가 이미 push 된 상태에서 cancel 되면 재빌드를 위해 재태깅이 필요한데,
      # 플레이크 회수가 잦은 npm-cache miss 등으로 사용자가 release 흐름을 막히는 비용이
      # Windows 빌드 1개 추가 실행 비용보다 크다. Ubuntu 시그널은 그대로 보존.
      fail-fast: false
      matrix:
        # windows-2025 는 2026-06-08~15 에 GitHub 측에서 VS2022→VS2026 으로 자동 마이그레이션된다
        # (windows-latest/windows-2025 라벨 공통, 투명 리다이렉트라 라벨 변경 불필요).
        # 본 프로젝트는 네이티브 모듈(node-gyp/electron-rebuild)이 0개이고 빌드가 electron-vite
        # 번들링 + electron-builder NSIS(makensis) + Sigstore 로 VS 툴체인에 의존하지 않으므로
        # VS 버전 전환의 영향을 받지 않는다. windows-2025-vs2026 라벨은 테스트 전용(마이그레이션
        # 후 windows-2025 로 환원)이라 영구 핀 금지. VS2022 고정이 필요해지면(향후 네이티브 추가 시)
        # windows-2022 로 변경할 것.
        #
        # QA20(D-MED): 아래 step 들의 조건을 OS 라벨 문자열 비교(`matrix.os == 'ubuntu-latest'`)로
        # 두면, 위 주석이 지시하는 라벨 변경(windows-2025→windows-2022 등)만으로 커버리지·E2E·
        # Windows 유닛 게이트가 **한 번도 실행되지 않은 채 잡이 성공**한다(무증상 실효 — 이 저장소가
        # test.yml 4릴리즈 연속 red 로 이미 겪은 계열). 라벨 대신 **의도 플래그**로 분기한다.
        include:
          - os: ubuntu-latest
            coverage: true
            e2e: true
            # QA26(D-Medium): audit 은 커버리지와 무관한 관심사인데 같은 플래그에 얹혀 있었다.
            # test.yml 이 커버리지를 별도 잡으로 분리한 전례가 있어, 릴리즈 쪽도 같은 정리를 하는
            # 순간 audit 두 스텝이 조용히 딸려 사라진다(QA24 D-M2 가 라벨→플래그로 옮기며 막으려던
            # 클래스가 플래그 재사용으로 재발할 자리). 자기 플래그를 준다.
            audit: true
          - os: windows-2025
            unitOnly: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # QA20(B-MED): persist-credentials:false — 이 잡은 자산을 올리지 않으므로 토큰을
      # .git/config 에 남길 이유가 없다(npm ci 가 실행하는 서드파티 스크립트의 탈취 표면 제거).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Node 24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # R37 P5-3 (v0.18.23): 20.11 → 22. Node 20.11 EoL(2026-04) 경과 + test.yml 매트릭스/
          # engines(현재 <25) 정렬. 네이티브 모듈 0개라 빌드 Node 의존 없음.
          node-version: '22'
          cache: npm

      - run: npm ci

      # R31 (v0.18.18 patch): package-lock.json drift 게이트 — test.yml 과 동일 로직.
      # v0.18.19 patch R32 P2: lockfileVersion 3 은 root `version` 과 `packages[""].version`
      # 두 곳에 버전이 박혀 있다. 이전 게이트는 root 만 봤기 때문에 hand-edit 으로 둘이 어긋
      # 나면 `npm ci` 가 경고 + cache 무효화를 일으키는 채로 CI 가 그린이었다. 둘 다 검사.
      - name: Verify lockfile version sync
        shell: bash
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          lock_root_ver=$(node -p "require('./package-lock.json').version")
          lock_pkgs_ver=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$pkg_ver" != "$lock_root_ver" ] || [ "$pkg_ver" != "$lock_pkgs_ver" ]; then
            echo "::error::package.json version ($pkg_ver) drift — lock root=$lock_root_ver packages['']=$lock_pkgs_ver"
            exit 1
          fi

      # QA19(A-LOW): 태그 ↔ package.json 버전 일치 게이트.
      # 범프를 빠뜨리거나 태그를 잘못 밀면(v0.31.31 태그 + package.json 0.31.30) 전 게이트가
      # 통과하고 릴리즈도 정상으로 보이는데, 첨부되는 latest.yml 의 version 이 구버전이라
      # **기존 사용자 전원의 자동 업데이트가 조용히 멈춘다**("최신 버전입니다"로 영구 표시).
      # lockfile sync 게이트는 package.json↔lock 만 보므로 이 축은 무방비였다.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "v$pkg_ver" != "$tag" ]; then
            echo "::error::태그($tag) 와 package.json 버전(v$pkg_ver) 불일치 — 자동 업데이트 피드가 구버전을 가리키게 됩니다"
            exit 1
          fi

      # R28: noUncheckedIndexedAccess 등 tsconfig strict 게이트가 CI에서 항상 검증되도록 함.
      - run: npx tsc --noEmit

      # QA(post-v0.24.4): e2e/ 스펙은 src/** 밖이라 위 tsc 미포함 — 별도 프로젝트로 타입 게이트.
      - run: npx tsc -p tsconfig.e2e.json

      # QA(post-v0.24.4): 릴리즈 경로가 커버리지 게이트를 건너뛰던 결함 수정.
      #   태그는 임의 커밋에 push 될 수 있어, main 의 coverage 게이트(test.yml)를 통과 못 할
      #   코드도 릴리즈될 수 있었다. ubuntu 에서 test:coverage 로 게이트 강제(커버리지 비율은
      #   OS/Node 비의존이라 1회면 충분). windows-2025 는 경로/pwsh 회귀 검증용으로 plain
      #   유닛 테스트 유지 — 동일 ubuntu 에서 이중 실행(test + coverage)을 피한다.
      # QA24(D-M2): 의도 플래그로 바꾼 뒤에도 **플래그 자체가 빠지는 경우**는 여전히 무증상이다 —
      # matrix include 에서 `coverage: true` 를 지우면 커버리지 게이트가 사라지고 잡은 그대로
      # 초록이다. 결함이 OS 라벨에서 플래그 이름으로 이동했을 뿐이므로, "이 레그는 무엇을
      # 실행하기로 돼 있는가"를 레그 스스로 단언하게 한다. 어떤 게이트도 배정받지 못한 레그는
      # 존재 이유가 없으므로 실패시킨다.
      - name: Assert this leg has a job to do
        shell: bash
        run: |
          if [ "${{ matrix.coverage }}" != "true" ] && [ "${{ matrix.unitOnly }}" != "true" ]; then
            echo "::error::이 매트릭스 레그(${{ matrix.os }})에 실행할 게이트가 없습니다 — include 의 의도 플래그(coverage/unitOnly/e2e)가 누락되면 잡이 아무것도 검증하지 않고 통과합니다"
            exit 1
          fi
          # coverage 레그는 E2E 도 함께 지는 설계다(위 C5-I2 주석). e2e 플래그만 지워지면
          # 커버리지가 돌아 잡이 초록인 채 E2E 게이트만 조용히 사라진다.
          if [ "${{ matrix.coverage }}" = "true" ] && [ "${{ matrix.e2e }}" != "true" ]; then
            echo "::error::coverage 레그에 e2e 플래그가 없습니다 — E2E 스모크 게이트가 무증상으로 사라집니다"
            exit 1
          fi
          # QA26(D-Medium): audit 도 같은 이유로 레그가 스스로 단언한다 — 릴리즈 경로에
          # supply-chain 검사가 0건이던 것이 QA25 의 발견이었고(D-I2), 플래그가 조용히 빠지면
          # 그 상태로 되돌아간다.
          if [ "${{ matrix.coverage }}" = "true" ] && [ "${{ matrix.audit }}" != "true" ]; then
            echo "::error::coverage 레그에 audit 플래그가 없습니다 — 릴리즈 경로의 supply-chain 게이트가 무증상으로 사라집니다"
            exit 1
          fi

      # QA25(D-I2): 릴리즈 경로에 supply-chain 검사가 **0건**이었다. blocking audit 은
      #   test.yml 의 push/PR 잡에만 있어서, 태그를 밀면 그 경로는 통째로 우회됐다. 위 커버리지
      #   게이트가 같은 이유로 이미 한 번 뚫렸던 것과 동형이다(QA post-v0.24.4).
      #   advisory 는 시간이 지나며 새로 뜨므로 "마지막 main push 때 통과했다"는 보증이 되지
      #   않는다 — 자동 업데이트 도입 이후 이 산출물은 곧 전 사용자 코드 실행이다.
      #   로직 본체는 scripts/audit-shipped.mjs 단일 출처(test.yml 과 공유).
      - name: npm audit (프로덕션 트리 전량, blocking)
        if: matrix.audit
        shell: bash
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (배포물 한정, blocking)
        if: matrix.audit
        shell: bash
        run: |
          # ⚠️ 파이프 직결 금지 — pipefail + `npm audit` 의 exit 1(권고 존재)이 게이트
          # 판정과 무관하게 스텝을 실패시킨다. test.yml 과 동일 관용구.
          AUDIT_JSON=$(npm audit --json 2>/dev/null || true)
          printf '%s' "$AUDIT_JSON" | node scripts/audit-shipped.mjs

      - name: Unit tests + coverage gate (ubuntu)
        if: matrix.coverage
        # QA26(D-Important): 릴리즈 경로에서 커버리지 게이트가 실패하면 스크롤백 외에 단서가
        # 없었다 — 태그를 다시 밀기 전에 원인을 확인할 방법이 필요하다(test.yml 과 동일 관용구).
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload coverage test results on failure
        if: failure() && matrix.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-coverage-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Unit tests (windows path regression)
        if: matrix.unitOnly
        # QA27(D-MED): 저장소 안에서 유일하게 포렌식이 없는 테스트 실행이었다. 실패해도 남는
        # 것이 스크롤백뿐이라, **태그를 다시 미는 비용이 가장 큰 경로**에서 실패한 테스트
        # 이름조차 회수할 수 없었다(다른 4곳은 전부 junit 산출물을 올린다).
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload windows unit test results on failure
        if: failure() && matrix.unitOnly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-unit-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      # C5-I2(QA cycle5): E2E 스모크를 릴리즈 게이트로 승격. 이전엔 E2E 실행이 test.yml(main push)
      # 에만 있고 릴리즈 경로는 e2e 타입체크만 해서, 번들/IPC/preload 배선 회귀가 태그 push 로
      # 그린 릴리즈될 수 있었다 — test.yml 이 4릴리즈 연속 red 였던 M4 사건과 동일 구조의 맹점.
      # ubuntu 레그에서만 실행(+3~5분): CI-결정적 스펙 9건, AI 백엔드 불필요. Windows 레그는
      # 경로/pwsh 유닛 회귀 검증 전용 유지(이중 실행 회피).
      - name: Build + E2E smoke gate (ubuntu)
        if: matrix.e2e
        run: |
          npm run build
          xvfb-run --auto-servernum -- npx playwright test

      # C5-I3: 실패 포렌식 — trace(on-first-retry) 산출물 회수(test.yml e2e 잡과 대칭).
      - name: Upload E2E failure artifacts
        if: failure() && matrix.e2e
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-e2e-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    needs: test
    # windows-2025: 2026-06-15 까지 VS2026 으로 자동 전환되나 본 빌드는 VS 무의존(상단 matrix 주석 참조).
    runs-on: windows-2025
    timeout-minutes: 30
    # QA20(B-MED): 릴리즈 자산 업로드·Sigstore 증명이 필요한 **이 잡에만** 쓰기 권한을 준다.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # QA24(D-I3): **릴리즈 쓰기 토큰을 실제로 보유한 유일한 잡**인데 여기만 빠져 있었다.
          # QA20(B-MED)의 위협 모델("npm ci 가 서드파티 라이프사이클 스크립트를 돌리는데
          # checkout 이 토큰을 .git/config 에 남긴다")이 가장 강하게 적용되는 자리다 —
          # 침해된 devDependency 하나가 그 토큰으로 릴리즈 자산을 덮어쓸 수 있고, 자동 업데이트
          # 도입 이후 그 자산은 곧 전 사용자 코드 실행이다. 아래 업로드·증명 액션은
          # GITHUB_TOKEN/OIDC 를 쓰므로 git config 자격증명이 필요 없다.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # R37 P5-3 (v0.18.23): 20.11 → 22 (위 test 잡과 동일 사유).
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build && npx electron-builder --publish never

      # 패키징 산출물 스모크 — **자산 업로드 이전**에 실행해 깨진 패키지가 릴리즈에 붙지 않게 한다.
      #
      # 왜 필요한가: 다른 E2E 스펙은 전부 `electron.launch({ args: ['.'] })` 로 **소스 트리의
      # out/** 을 실행하므로 리포지토리의 node_modules 가 그대로 보인다 — 즉 "asar 안에 무엇이
      # 들어갔는가"를 구조적으로 검증하지 못한다. v0.31.32 에서 renderer 전용 deps 6종을
      # devDependencies 로 옮겨 asar 를 64.69→4.67MB 로 줄였는데(인스톨러 115.6→101.4MB), 그
      # 변경의 안전망이 되어야 할 이 스펙이 정작 CI 어디에서도 호출되지 않고 있었다. 자동 업데이트
      # (v0.31.30~) 도입 이후로는 잘못된 패키지가 곧 **전 사용자에게 자동 배포**되므로 릴리즈
      # 경로에 게이트로 세운다.
      #
      # PACKAGED_SMOKE_REQUIRED=1 — 스펙의 skip 조건(산출물 없음/비-Windows)을 실패로 승격한다.
      # 이게 없으면 exe 경로가 어긋나는 순간 "skip=green" 으로 게이트가 무증상 증발한다
      # (이 저장소가 이미 겪은 실패 클래스: test.yml 4릴리즈 연속 red, QA20 D-MED 라벨 하드코딩).
      #
      # 브라우저 다운로드(`playwright install`) 불필요 — _electron.launch 는 패키징된 실행 파일을
      # executablePath 로 직접 띄운다. 이 스펙 하나만 지정해 소스트리 스펙(ubuntu test 잡에서 이미
      # 실행됨)의 중복 실행을 피한다.
      - name: Packaged app smoke gate (asar)
        env:
          PACKAGED_SMOKE_REQUIRED: '1'
        run: npx playwright test e2e/packaged-smoke.spec.ts

      - name: Upload packaged smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-smoke-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      # R37 P2 (v0.18.23): 빌드 실패 시 dist/ 와 out/ 를 회수해야 재현 디버깅이 가능하다.
      # 현재까지는 stderr 만 GitHub Actions 로그에 남고 NSIS 중간 산출물(makensis 로그),
      # electron-vite 번들 산출물, electron-builder app-builder 결과물이 worker 종료와 함께 사라졌다.
      # if: failure() — 성공 시 30~150MB artifact 업로드를 피해 일반 흐름의 잡 시간을 늘리지 않음.
      # path 는 dist/ + out/ 만 (workspace 내부). electron-builder 글로벌 캐시(%LOCALAPPDATA%)
      # 는 Windows runner 의 ~ 확장이 불안정해 제외; 필요해지면 별도 step 으로 LOCALAPPDATA 사용.
      #
      # QA21(A-LOW): dist/win-unpacked 는 제외한다. 이 step 이 처음 쓰인 시점에는 빌드 자체가
      # 실패한 상태(dist 가 비어 있거나 부분)를 상정했지만, 이제는 그 뒤의 패키징 스모크 게이트가
      # 실패할 수 있고 그때 dist 는 **완전한** 상태다 — win-unpacked(~250MB) + installer(101MB)
      # 를 올리려 하면 콜드 러너의 빌드 시간과 합쳐 30분 잡 상한에 근접해, 정작 진단이 필요한
      # 순간에 업로드가 잘린다. installer·blockmap·latest.yml 과 out/ 만으로 재현에 충분하고,
      # win-unpacked 는 installer 에서 다시 만들 수 있다.
      # 핀 SHA 는 gh api 로 tag→commit 확인 후 고정. 버전은 uses 줄 끝 주석이 단일 출처.
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows-failure-${{ github.run_id }}
          path: |
            dist/
            out/
            !dist/win-unpacked/**
          if-no-files-found: warn
          retention-days: 7

      - name: Compute SHA256 for installer
        id: hash
        shell: pwsh
        run: |
          $file = (Get-ChildItem dist/*Setup*.exe | Select-Object -First 1).FullName
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          $name = (Split-Path $file -Leaf)
          "filename=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$hash  $name" | Out-File -FilePath dist/SHA256SUMS-windows.txt -Encoding ascii

      - name: Attest build provenance (Windows)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*Setup*.exe

      # Node24 런타임.
      # QA(post-v0.24.4): 이전 v2.6.2 는 deprecated Node20 기반이라 GitHub 의 Node20 shim
      # 제거 시 자산 업로드 스텝이 깨질 위험이 있었다. v3.0.0 은 node24 + files/append_body/body
      # 입력 동일(검증 완료)이라 호환 범프.
      # QA28(D-Low): v3.0.0 → v3.0.2. annotated tag 를 dereference 한 commit SHA 로 핀,
      # action.yml runs.using=node24 확인.
      # 자동 업데이트 자산 검증 — electron-updater 는 릴리즈에 latest.yml 이 있어야 새 버전을
      # 감지하고, .blockmap 이 있어야 차등(delta) 다운로드를 한다. package.json 의 build.publish
      # (github provider)가 설정돼 있어야 electron-builder 가 이 둘을 생성하는데, 그 설정이
      # 지워지면 빌드는 그대로 성공하고 릴리즈도 정상으로 보이지만 **모든 사용자의 자동 업데이트가
      # 조용히 멈춘다**(앱은 "최신 버전"으로 계속 표시). 자산 업로드 전에 존재를 강제한다.
      - name: Verify auto-update metadata exists
        shell: bash
        run: |
          for f in dist/latest.yml dist/*Setup*.exe.blockmap; do
            if [ ! -f "$f" ]; then
              echo "::error::auto-update 자산 누락: $f — package.json build.publish(github) 설정을 확인하세요"
              exit 1
            fi
          done
          echo "latest.yml + blockmap OK"

      - name: Upload installer to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*Setup*.exe
            dist/SHA256SUMS-windows.txt
            dist/latest.yml
            dist/*Setup*.exe.blockmap
          append_body: true
          body: |
            ### Windows installer SHA-256
            ```
            ${{ steps.hash.outputs.sha256 }}  ${{ steps.hash.outputs.filename }}
            ```

  # R28: macOS dmg는 코드사인/공증 자격이 없어 Gatekeeper에 차단됨 (사용자가 `xattr -d`를
  # 직접 실행해야 열 수 있는 상태로 출시되던 문제). Apple Developer ID + APPLE_ID/PASSWORD/TEAM_ID
  # 시크릿 + `mac.notarize` electron-builder 구성을 추가하기 전까지 macOS 빌드를 비활성화한다.
  # 복구 방법: 위 시크릿을 등록한 뒤 build-mac 잡과 package.json 의 build.mac 블록에 notarize 설정을 추가하고
  # test.yml matrix에 macos-latest를 다시 포함하면 된다.
  #
  # build-mac:
  #   needs: test
  #   runs-on: macos-latest
  #   ...
