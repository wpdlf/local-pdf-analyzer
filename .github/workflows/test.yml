name: Test

on:
  push:
    branches: [main]
  pull_request:
  # QA22(D): 셔플 잡 전용 야간 트리거. 아래 shuffle 잡 주석 참조.
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST

permissions:
  contents: read

# QA28(D-Low): 같은 브랜치에 push 가 연달아 오면 앞선 런은 이미 낡은 커밋을 검증하고 있다 —
# 취소해 러너 시간을 아낀다(release.yml 은 태그 자산이 걸려 있어 cancel-in-progress: false 로
# 직렬화만 하는 것과 대칭). event_name 을 group 에 넣는 이유: 야간 schedule(shuffle·package-smoke)
# 도 ref 는 refs/heads/main 이라 ref 만으로 묶으면 무관한 push 가 야간 잡을 죽인다.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # R37 P4-3 (v0.18.23): Node matrix 도입.
    # 기존엔 Node 20.11 단일이었으나 package.json `engines.node` 가 `>=20.11 <25` 로 24 까지
    # 허용하고 사용자의 실제 개발 환경이 Node 22 LTS 인 경우가 증가. 20.11 EoL (2026-04) 임박과
    # 함께 22 검증 선행 필요. fail-fast: false — 한 Node 버전의 플레이크가 다른 버전 신호를
    # 가리지 않도록.
    # R37 P5-3 (v0.18.23): release.yml 의 test/build 잡도 Node 22 로 정렬 (20.11 EoL 2026-04 경과).
    # 본 프로젝트는 네이티브 모듈 0개라 빌드의 Node 버전 의존이 없어 안정성 손실 없이 통일.
    # (v0.19.1+): 로컬 개발 환경 Node 24 업그레이드에 따라 engines <25 로 확장, 매트릭스에 24 추가.
    # (v0.28.0): Node 20.11 매트릭스 제거. electron@41.8.0 / @electron/get@5.0.0 가 ESM 전용으로
    # `engines.node >=22.12` 를 요구 → 20.11 에서 electron postinstall(install.js, CommonJS)이
    # require('@electron/get') 시 ERR_REQUIRE_ESM 로 `npm ci` 가 하드 실패 (v0.27.0 Test red 원인).
    # 20.11 EoL(2026-04) 도 경과. engines.node 하한도 이후 >=22.13 으로 상향 정합(현행).
    # C5-I4(QA cycle5): windows-2025 유닛 레그 추가 — 이전엔 Windows 유닛 신호가 release.yml
    # (태그 시점)에만 있어, 경로 구분자/pwsh 회귀가 main 에 조용히 쌓이고 발견 시점 = 태그 push
    # 후(수정 + 재태깅 강제)였다. Node 22 단일로 비용 최소화(교차 OS×Node 매트릭스 불필요).
    # QA24(D-M4): 야간 스케줄은 shuffle·package-smoke 전용이다. 이 잡까지 매일 도는 것은
    # push/PR 에서 이미 검증한 것의 중복 실행일 뿐이라 러너 시간만 쓴다.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22'
          - os: ubuntu-latest
            node-version: '24'
          - os: windows-2025
            node-version: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Node 24 호환, v0.18.11 R29 #1 마이그레이션
      # QA28(D-Low): persist-credentials:false — release.yml 의 QA20(B-MED) 조치(npm ci 가 돌리는
      # 서드파티 스크립트에 .git/config 토큰을 남기지 않는다)가 test.yml 의 push/PR 잡 3곳에는
      # 미적용이었다(형제 누락). 토큰은 contents:read 지만 표면을 남길 이유가 없다.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Node 24 호환
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # R31 (v0.18.18 patch): package-lock.json root version 이 package.json 과
      # drift 됐는지 검증. v0.18.17 → v0.18.18 로 넘어갈 때 자동화 미구현으로
      # drift 가 재발생한 사례 (R30 발견) → 매 PR/release 에서 강제.
      # v0.18.19 patch R32 P2: lockfileVersion 3 의 `packages[""].version` 도 같이 검증.
      # 둘 중 하나만 손으로 수정해도 `npm ci` 가 cache 키 무효화 + 경고를 발생시키지만
      # 직전 게이트는 root 만 봐서 silent 통과하던 결함 (R32 Surface 4 P3).
      - name: Verify lockfile version sync
        shell: bash
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          lock_root_ver=$(node -p "require('./package-lock.json').version")
          lock_pkgs_ver=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$pkg_ver" != "$lock_root_ver" ] || [ "$pkg_ver" != "$lock_pkgs_ver" ]; then
            echo "::error::package.json version ($pkg_ver) drift — lock root=$lock_root_ver packages['']=$lock_pkgs_ver"
            echo "Run 'npm install --package-lock-only' and commit the result."
            exit 1
          fi
          echo "lockfile sync OK: $pkg_ver (root + packages[''])"

      # R28: tsconfig strict 게이트(noUncheckedIndexedAccess 등)가 PR/push 단계에서 항상 검증되도록 함.
      - run: npx tsc --noEmit

      # QA(post-v0.24.4): e2e/ 스펙은 루트 tsconfig include(src/**) 밖이라 위 tsc 가 못 잡는다.
      # 별도 프로젝트(tsconfig.e2e.json)로 타입 게이트 — e2e 타입 에러가 Playwright 런타임에서야
      # 드러나던 결함 차단.
      - run: npx tsc -p tsconfig.e2e.json

      # QA22(D-MED): junit 리포터 + 실패 시 아티팩트. 이전에는 유닛 잡이 실패해도 **어떤 파일도
      # 남기지 않아** 기본 리포터 출력이 raw 로그에만 묻혔다 — 2026-08-03 릴리즈 게이트에서 1건이
      # 실패했는데 스크롤백을 놓쳐 **테스트 이름을 영영 확보하지 못한** 직접 원인이다(이후 25회
      # 재현 0). e2e 잡은 이미 trace 를 올리고 release.yml 도 진단을 올리는데 유닛만 빠져 있었다.
      # 성공 시에는 업로드하지 않으므로 비용 0.
      - run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload unit test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-failure-${{ matrix.os }}-node${{ matrix.node-version }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      # R29 #1: supply-chain 가시성 — high 이상의 알려진 취약점을 PR/push 단계에서 빠르게 노출.
      # 현재 알려진 dev-only 의존성(vite/postcss/xmldom/ip-address) 은 major bump 가 필요해 별도 라운드 예정.
      # 그동안 회귀 도입을 막기 위해 high 이상만 경고로 출력하고 빌드는 막지 않는다.
      # R31 P2 (v0.18.19): step summary 에 advisory 결과 명시 노출.
      # `continue-on-error: true` 가 step 실패는 흡수했지만 결과가 raw 로그에만 묻혀
      # 사용자가 advisory 존재를 인지하기 어려웠음. JSON 으로 파싱해 GITHUB_STEP_SUMMARY 에 카운트 출력.
      #
      # v0.18.20 R32 P2: `if: always()` 추가 — 이전엔 npm test (line 45) 실패 시 audit step
      # 이 통째로 skip 되어 supply-chain 신호가 GITHUB_STEP_SUMMARY 에서 사라졌다. red CI
      # 상황에서 advisory 가 가장 봐야 하는데 가려지던 결함 (R32 Surface 4 P2). step 자체는
      # 여전히 `continue-on-error: true` 라 non-blocking 성질 유지.
      - name: npm audit (advisory, non-blocking)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # v0.18.19 patch R34 P1 (R33 회귀 fix): `if: always()` 가 npm ci 실패 후에도 본 step 을
          # 실행하는데, node_modules 부재 시 npm audit 은 error JSON 을 반환해 이전 파서가 모든
          # 값을 0 으로 떨어뜨려 "취약점 없음" 으로 거짓 보고하던 결함 (R33 Surface 4 P3).
          # node_modules 존재 여부를 선행 검사하고, 부재 시 명시적으로 "audit 미실행" 으로 분기.
          if [ ! -d node_modules ]; then
            {
              echo "## npm audit"
              echo ""
              echo ":warning: audit 미실행 — \`node_modules\` 디렉터리 부재 (선행 \`npm ci\` 실패 가능성). 본 단계는 advisory 라 빌드는 통과하지만 supply-chain 가시성이 일시 후퇴함."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          AUDIT_JSON=$(npm audit --json 2>/dev/null || true)
          if [ -z "$AUDIT_JSON" ]; then
            echo "## npm audit" >> "$GITHUB_STEP_SUMMARY"
            echo ":warning: audit 실행 실패 (네트워크 등)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # v0.18.19 patch R32 P2: 단일 node 호출로 세 값을 한 번에 추출.
          # 이전엔 동일 audit JSON 을 세 번 spawn 으로 재파싱했고, set +e + ARG_MAX edge 에서
          # 한 호출이 실패하면 빈 문자열로 떨어져 다음 `[ "$X" -gt 0 ]` 가 silent 산식 오류
          # 를 일으키는 fragility 가 있었음. read 로 묶어 1회 spawn 으로 합친다.
          # R34 P1 (R33 회귀 fix): node 측에서 audit JSON 의 error 분기 (예: { error: {...} }) 도
          # 처리. 또 read 가 빈 stdin 받아 변수가 비는 경우 `: ${VAR:=0}` 디폴트로 shell 산식
          # 에러 (`[: -gt: unary operator expected`) 차단.
          AUDIT_PARSED=$(node -e "
            try {
              const j = JSON.parse(process.argv[1]);
              if (j && j.error) { console.log('ERROR'); process.exit(0); }
              const v = (j && j.metadata && j.metadata.vulnerabilities) || {};
              console.log((v.high||0)+(v.critical||0), v.moderate||0, v.low||0);
            } catch { console.log('ERROR'); }
          " "$AUDIT_JSON")
          if [ "$AUDIT_PARSED" = "ERROR" ]; then
            {
              echo "## npm audit"
              echo ""
              echo ":warning: audit JSON 파싱 실패 또는 npm 측 error 응답 — supply-chain 신호 일시 부재."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read HIGH MODERATE LOW <<< "$AUDIT_PARSED"
          : "${HIGH:=0}" "${MODERATE:=0}" "${LOW:=0}"
          {
            echo "## npm audit (advisory)"
            echo ""
            echo "| Severity | Count |"
            echo "|---|---|"
            echo "| high+critical | $HIGH |"
            echo "| moderate | $MODERATE |"
            echo "| low | $LOW |"
            if [ "$HIGH" -gt 0 ]; then
              echo ""
              echo ":warning: **$HIGH** high/critical advisory 발견. 빌드는 통과하지만 review 필요 (`npm audit --audit-level=high` 로 상세).";
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # human-readable 출력도 logs 에 남김 (기존 동작 보존).
          npm audit --audit-level=high || true

      # QA25(D-H1): 아래 "배포물 한정" 게이트는 advisory 의 **패키지 이름**을 shipped 집합과
      # 대조한다. 그래서 배포 패키지의 **전이 의존**은 구조적으로 한 건도 매칭되지 않았고,
      # electron-updater → js-yaml 의 high 권고(GHSA-5p4m-2wfm-xmqj)가 실제로 통과하고 있었다.
      # 이 스텝이 프로덕션 트리 전량을 이름 대조 없이 본다. 이 저장소의 런타임 의존은
      # electron-updater 하나뿐이라(//dependenciesPolicy) 노이즈가 사실상 0 이다.
      # 주의: audit JSON 의 `effects` 로 dependent 를 거슬러 올라가는 방식은 **작동하지 않는다** —
      # 취약 패키지 자체가 범위 내에서 수정 가능하면 npm 이 effects 를 빈 배열로 준다(실측).
      - name: npm audit (프로덕션 트리 전량, blocking)
        if: always()
        shell: bash
        run: |
          # QA29(D2-2): 종전에는 `::warning::` + `exit 0` 이었다. npm ci 실패면 잡 자체는 이미
          # 빨갛지만, **게이트 스텝은 초록으로 남아** "이 실행에서 공급망 검사가 통과했다" 는
          # 기록을 만든다 — 이 저장소가 반복해 겪은 '조용한 부재' 의 정확한 모양이다.
          # 이 스텝은 npm ci 뒤에만 도므로 node_modules 부재는 정상 상태가 아니다. 실패시킨다.
          if [ ! -d node_modules ]; then
            echo "::error::node_modules 부재 — prod audit 을 실행할 수 없습니다(게이트를 건너뛰지 않습니다)"
            exit 1
          fi
          npm audit --omit=dev --audit-level=high

      # QA24(D-I1): 위 스텝은 **전체** advisory 를 non-blocking 으로 요약한다. 그 결과 매 실행
      # "high+critical 8" 이 출력되는데 그중 어느 것이 실제 배포물인지 알 방법이 없어 전체가
      # 노이즈로 학습됐고, pdfjs-dist 의 "악성 PDF 열람 시 임의 JS 실행" HIGH 권고가 거기
      # 묻혀 있었다. `--omit=dev` 로 거르는 통상적 필터는 이 저장소에서 **정확히 반대** 결과를
      # 낸다 — //dependenciesPolicy 가 renderer 라이브러리를 전부 devDependencies 로 옮겼기
      # 때문이다(인스톨러 13.5MB 축소). 그래서 "배포물에 실제로 들어가는 것" 만 따로,
      # **차단성으로** 본다. 목록은 package.json 의 shippedDevDependencies 가 단일 출처.
      #
      # QA25(D-I2): 로직 본체는 scripts/audit-shipped.mjs 단일 출처다 — release.yml 이
      # 이 게이트를 통째로 우회하고 있었기 때문에(태그 경로에 audit 0건) 양쪽이 같은 파일을
      # 부르도록 했다. 폐포 계산은 audit-shipped.test.ts 가 회귀를 막는다.
      - name: npm audit (배포물 한정, blocking)
        if: always()
        shell: bash
        run: |
          # QA29(D2-2): 위 스텝과 같은 이유로 실패시킨다 — 게이트가 초록인 채 사라지지 않도록.
          if [ ! -d node_modules ]; then
            echo "::error::node_modules 부재 — shipped audit 을 실행할 수 없습니다(게이트를 건너뛰지 않습니다)"
            exit 1
          fi
          # ⚠️ 파이프로 직접 연결하면 안 된다 — 이 스텝은 bash -o pipefail 로 돌고
          # `npm audit` 은 **권고를 하나라도 찾으면 exit 1** 이다(빌드툴 권고는 항상 있다).
          # 그러면 게이트 판정과 무관하게 스텝이 실패한다. 종료코드를 삼키고 본문만 넘긴다.
          AUDIT_JSON=$(npm audit --json 2>/dev/null || true)
          set +e
          printf '%s' "$AUDIT_JSON" | node scripts/audit-shipped.mjs
          rc=$?
          set -e
          # QA29(D2-1): 종료코드 2 = "audit JSON 이 축퇴 입력이라 검사 자체를 못 했다".
          # 위 캡처가 종료코드와 stderr 를 함께 삼키므로, 레지스트리 인증 실패·네트워크 플레이크·
          # npm 출력 형식 변경이 전부 **빈 문자열/`{}`** 로 도착한다. 종전에는 그 전부가 exit 0
          # 이었고 `{}` 는 로그에 한 줄도 남기지 않았다. push/PR 경로에서는 경고로 넘기되
          # (플레이크가 개발을 막지 않도록) 반드시 Actions UI 에 보이게 한다.
          # 릴리즈 태그 경로(release.yml)는 같은 코드를 **실패**로 다룬다.
          if [ "$rc" = "2" ]; then
            echo "::warning::배포물 audit 을 건너뜁니다 — 이 실행에는 공급망 신호가 없습니다"
            exit 0
          fi
          exit $rc

  coverage:
    # R37 P5-2 (v0.18.23): 커버리지 게이트를 CI 에서 실제 강제 (QA M2).
    # 그동안 vitest.config.mts 의 thresholds (Stmts38/Branch33/Funcs41/Lines39) 는
    # `npm run test:coverage` 수동 실행 때만 적용돼, CI 의 `npm test`(=vitest run, no-coverage)
    # 는 커버리지 회귀를 silent 통과시켰다. 본 잡이 threshold 미달 시 빌드를 fail 시킨다.
    # 단일 Node(22) ubuntu 1회만 측정 — 커버리지 비율은 OS/Node 비의존적이라 매트릭스 불필요.
    # 테스트가 2회(test 매트릭스 + 본 잡) 도는 비용은 있으나, 게이트 명확성/격리를 우선.
    # QA24(D-M4): 야간 스케줄은 shuffle·package-smoke 전용이다. 이 잡까지 매일 도는 것은
    # push/PR 에서 이미 검증한 것의 중복 실행일 뿐이라 러너 시간만 쓴다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false # QA28(D-Low): test 잡과 동일 사유

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # vitest.config.mts 의 coverage.thresholds 미달 시 vitest 가 non-zero exit → 잡 실패.
      # 베이스라인 상승 시(예: pdf-parser/use-summarize 테스트 추가) thresholds 동시 상향 권장.
      # QA26(D-Important): junit 리포터와 실패 아티팩트가 `npm test` 스텝에만 붙어 있었다.
      # QA22 가 그 장치를 만든 계기는 "릴리즈 게이트 1건 실패 → 스크롤백을 놓쳐 테스트 이름을
      # 영영 확보 못 함" 이었는데, 정작 **커버리지 경로에는 없었다**. QA26 라운드에서 실제로
      # 그 경로의 미상 플레이크 1건을 겪었고 이름을 잡지 못했다. 같은 관용구를 여기에도 적용한다.
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload coverage test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # R45: E2E 스모크 (Playwright + Electron) — 빌드 산출물(out/) 실행으로 단위 테스트가
  # 구조적으로 못 덮는 영역(electron-vite 번들, preload 실배선, pdfjs worker/cmaps 로딩,
  # main↔renderer IPC 왕복)을 검증. AI 백엔드 불필요(결정적 경로만 사용).
  # R45+2: 도입 후 2회 연속 그린 + retry 1(playwright.config) 안정화 확인 → 게이트 승격
  # (continue-on-error 제거). 실패 시 빌드가 red — 번들/IPC 배선 회귀를 차단한다.
  e2e:
    # QA24(D-M4): 야간 스케줄은 shuffle·package-smoke 전용이다. 이 잡까지 매일 도는 것은
    # push/PR 에서 이미 검증한 것의 중복 실행일 뿐이라 러너 시간만 쓴다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false # QA28(D-Low): test 잡과 동일 사유

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # ubuntu 러너는 디스플레이가 없어 xvfb 경유로 Electron 기동.
      # (ubuntu-24.04 의 unprivileged userns 제한은 spec 의 CI 한정 --no-sandbox 가 대응)
      - name: E2E smoke (xvfb)
        run: xvfb-run --auto-servernum -- npx playwright test

      # C5-I3(QA cycle5): 실패 포렌식 — playwright.config 의 trace(on-first-retry) 산출물을 회수.
      # 이전엔 line 로그 한 줄이 전부라 CI 전용 실패의 원인 파악 비용이 커 red 방치를 유발했다
      # (release.yml build 잡의 진단 artifact 와 대칭). 성공 시 업로드 없음 — 잡 시간 영향 0.
      # release.yml 과 동일 SHA 핀.
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # QA22(D): 테스트 **순서 의존**을 자동 감시하는 야간 잡.
  #
  # 존재 이유: vitest.config.mts 는 `shuffle: false` 로 선언 순서를 고정하는데, 그 주석이
  # "우발적 통과를 줄인다" 고 적어둔 것과 달리 실제로는 **고착**시킨다. 22차 QA 에서 셔플 4시드로
  # 실측한 결과 고정 순서에서 그린인 **최대 11건**이 순서만 바꾸면 실패했고(3파일), 그중 1건은
  # 단독 실행만으로도 실패했다 — 즉 회귀 넷이 앞 테스트의 상태 누수로 통과하고 있었다.
  # 같은 클래스가 QA21(use-session.test.ts)에 이어 2사이클 연속 발견됐으므로 사람 감시에
  # 맡기지 않는다. PR/push 를 막지 않도록 야간 전용 + non-blocking.
  #
  # 시드를 고정하지 않는다(매일 다른 순서) — 고정하면 그 순서에만 맞춰지고 나머지는 다시 숨는다.
  # 실패 시 junit 아티팩트로 어느 테스트가 어떤 순서에서 깨졌는지 재현 가능하게 남긴다.
  shuffle:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests (randomized order)
        id: shuffle-run
        continue-on-error: true
        run: npm test -- --sequence.shuffle.tests --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      # QA24(D-M4): 잡이 continue-on-error 라 실패해도 Actions 목록에는 **초록 체크**만 남는다.
      # 순서 의존 회귀를 자동 감시하려고 만든 잡인데 알림 경로가 없어, 실제로 깨져도 아무도
      # 모른다(junit 아티팩트는 열어볼 이유가 생기지 않는 실행에 붙는다). 요약에 명시한다.
      - name: Report shuffle result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.shuffle-run.outcome }}" != "success" ]; then
            {
              echo "## :rotating_light: 순서 의존 테스트 발견"
              echo ""
              echo "무작위 순서에서 실패한 테스트가 있습니다. 고정 순서(\`shuffle: false\`)에서는 그린이므로"
              echo "앞선 테스트의 상태 누수에 기대고 있는 회귀 넷입니다 — QA21·QA22 에서 연속 발견된 클래스."
              echo ""
              echo "\`shuffle-failure-${{ github.run_id }}\` 아티팩트의 junit.xml 에서 실패 테스트명을 확인하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            # 잡은 continue-on-error 라 빨간불이 되지 않는다. 최소한 annotation 으로는 남긴다.
            echo "::warning::무작위 순서에서 테스트 실패 — 순서 의존 회귀 가능성"
          else
            echo "## :white_check_mark: 무작위 순서에서도 전부 통과" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shuffle failure artifacts
        if: steps.shuffle-run.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shuffle-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  # QA24(D-I2): **태그 전 패키징 검증**. electron-builder 는 release.yml 에서만 실행되므로,
  # files 패턴 / asarUnpack / nsis / build.publish / postbuild cmaps 복사 같은 패키징 계약이
  # 깨지면 발견 시점이 **태그를 이미 민 뒤**다 — 그때는 수정 + 재태깅이 강제된다. 이 저장소가
  # C5-I4(windows 유닛 레그 추가)로 이미 한 번 해결한 문제의 상위 계층 재발이다.
  #
  # 특히 `Verify auto-update metadata exists`(release.yml)가 지키는 build.publish 삭제
  # 시나리오는 **전 사용자 자동 업데이트 정지**인데, 그 게이트 자체가 태그 시점에만 존재했다.
  #
  # 야간 1회로 충분하다(패키징 계약은 매 커밋 바뀌지 않는다). PR/push 를 막지 않도록 스케줄
  # 전용이되, shuffle 과 달리 continue-on-error 를 두지 않는다 — 이건 "발견하면 곧 릴리즈가
  # 깨진다"는 신호라 초록으로 묻히면 존재 이유가 없다.
  package-smoke:
    if: github.event_name == 'schedule'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - run: npm run build && npx electron-builder --publish never

      # release.yml 과 **동일한** 게이트를 같은 조건으로 실행한다. 여기서만 느슨하게 두면
      # 야간은 통과하고 릴리즈에서 실패하는, 신호로서 무의미한 잡이 된다.
      - name: Packaged app smoke gate (asar)
        env:
          PACKAGED_SMOKE_REQUIRED: '1'
        run: npx playwright test e2e/packaged-smoke.spec.ts

      - name: Verify auto-update metadata exists
        shell: bash
        run: |
          for f in dist/latest.yml dist/*Setup*.exe.blockmap; do
            if [ ! -f "$f" ]; then
              echo "::error::auto-update 자산 누락: $f — package.json build.publish(github) 설정을 확인하세요"
              exit 1
            fi
          done
          echo "latest.yml + blockmap OK"

      - name: Upload packaging failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-package-failure-${{ github.run_id }}
          path: |
            dist/
            out/
            test-results/
            !dist/win-unpacked/**
          if-no-files-found: warn
          retention-days: 7
